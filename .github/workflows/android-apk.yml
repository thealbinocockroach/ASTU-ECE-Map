name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name the install package
        run: cp app/build/outputs/apk/debug/app-debug.apk ASTU-ECE-Map-debug.apk

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTU-ECE-Map-debug-apk
          path: ASTU-ECE-Map-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" ASTU-ECE-Map-debug.apk \
            --title "ASTU ECE Map $TAG_NAME" \
            --notes "Install the attached APK directly on Android 8.0 (API 26) or newer."
