name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare stable APK signing key
        env:
          APK_SIGNING_KEYSTORE_BASE64: ${{ secrets.APK_SIGNING_KEYSTORE_BASE64 }}
          APK_SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_STORE_PASSWORD }}
          APK_SIGNING_KEY_ALIAS: ${{ secrets.APK_SIGNING_KEY_ALIAS }}
          APK_SIGNING_KEY_PASSWORD: ${{ secrets.APK_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$APK_SIGNING_KEYSTORE_BASE64" ]; then
            echo "$APK_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ece-map-signing.keystore"
            echo "APK_SIGNING_KEYSTORE=$RUNNER_TEMP/ece-map-signing.keystore" >> "$GITHUB_ENV"
            echo "APK_SIGNING_STORE_PASSWORD=$APK_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "APK_SIGNING_KEY_ALIAS=$APK_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "APK_SIGNING_KEY_PASSWORD=$APK_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name the install package
        run: cp app/build/outputs/apk/debug/app-debug.apk ASTU-ECE-Map-debug.apk

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTU-ECE-Map-debug-apk
          path: ASTU-ECE-Map-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" ASTU-ECE-Map-debug.apk \
            --title "ASTU ECE Map $TAG_NAME" \
            --notes "Install the attached APK directly on Android 8.0 (API 26) or newer."
